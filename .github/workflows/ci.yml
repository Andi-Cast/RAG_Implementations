name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://rag:rag@localhost:5432/rag
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Load schema
        run: psql "$DATABASE_URL" -f src/rag/db/schema.sql

      - name: Restore CI fixture
        run: gunzip -c tests/fixtures/ci_corpus.sql.gz | psql "$DATABASE_URL"

      - name: Run tests
        run: uv run pytest tests/
